# Local test servers for Ferry's integration tests.
# Start/stop with testinfra/start.sh and testinfra/stop.sh.
# Credentials and ports are mirrored in FerryKit/Tests/FerryIntegrationTests/TestServers.swift.
name: ferry-testinfra

services:
  sftp:
    image: atmoz/sftp:alpine
    container_name: ferry-test-sftp
    ports:
      - "127.0.0.1:2222:22"
    # user:password:uid::writable-home-subdir
    command: ferry:ferrypass:1001::upload
    volumes:
      # NOT inside upload/: Docker would create the mountpoint parent as
      # root, making upload/ unwritable for the ferry user.
      - ./fixtures/seed:/home/ferry/fixtures:ro
      # Public key for pubkey-auth tests (M11). atmoz/sftp appends every key in
      # .ssh/keys to authorized_keys at startup. Generated by start.sh.
      - ./fixtures/keys:/home/ferry/.ssh/keys:ro
      # Boot hook (M11): relax OpenSSH 9.8+ PerSourcePenalties so the TOFU
      # rejection tests don't wedge the source IP. See sftp.d/00-relax-sshd.sh.
      - ./sftp.d:/etc/sftp.d:ro

  ftp:
    image: delfer/alpine-ftp-server
    container_name: ferry-test-ftp
    ports:
      - "127.0.0.1:2121:21"
      - "127.0.0.1:21000-21010:21000-21010"
    environment:
      USERS: "ferry|ferrypass|/ftp/ferry"
      ADDRESS: "127.0.0.1"
      MIN_PORT: "21000"
      MAX_PORT: "21010"
    volumes:
      - ./fixtures/seed:/ftp/ferry/fixtures:ro
