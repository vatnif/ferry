# Ferry FTPS test server config — the delfer/alpine-ftp-server baked defaults
# plus require_ssl_reuse=NO. vsftpd defaults require the data-channel TLS
# session to resume the control channel's, which TLS 1.3 (and macOS's
# SecureTransport libcurl) don't do; turning it off makes the server lenient,
# like a well-configured real FTPS server. TLS on/off + certs are still applied
# by the image entrypoint from TLS_CERT/TLS_KEY (docker-compose.yml). Test-only.
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
vsftpd_log_file=/proc/1/fd/1
ftpd_banner=Welcome Alpine ftp server https://hub.docker.com/r/delfer/alpine-ftp-server/
listen=YES
pasv_enable=YES
pasv_addr_resolve=YES
seccomp_sandbox=NO
background=YES
require_ssl_reuse=NO
